name: TCS Seed
on: [push, pull_request]
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Native policy, terminal, serial, and authority tests
        run: make test
      - name: Saved artifacts and source inputs
        run: make verify-artifacts
      - name: Pinned build tools
        run: make bootstrap
      - name: Repeated bootstrap
        run: make bootstrap
      - name: Cross-compile signed administration core
        run: make admin-cross-check
      - name: Cross-compile experimental lifecycle model
        run: make lifecycle-cross-check
      - name: Emulator
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: Build and boot
        run: make smoke
      - name: Boot saved image
        run: make smoke-saved
      - name: Build and exercise UART terminal
        run: make terminal-smoke
      - name: Boot saved terminal
        run: make terminal-smoke-saved
      - name: Build and exercise release-kernel terminal
        run: make terminal-release-smoke
      - name: Boot saved release-kernel terminal
        run: make terminal-release-smoke-saved
      - name: Observe release-kernel memory and device isolation faults
        run: make isolation-smoke
      - name: Boot saved isolation test image
        run: make isolation-smoke-saved
      - name: Boot context and guest signature tests
        run: make boot-test-smoke
      - name: Saved boot context test image
        run: make boot-test-smoke-saved
      - name: Signed administration and execution receipts
        run: make admin-test-smoke
      - name: Saved signed administration test image
        run: make admin-test-smoke-saved
      - name: One-shot launcher and signed interactive UART
        run: make interactive-smoke
      - name: Saved signed interactive profiles
        run: make interactive-smoke-saved
